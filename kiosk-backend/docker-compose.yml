version: '3.8'

services:
  kiosk-mysql:
    image: mysql:8.0
    container_name: kiosk-mysql
    ports:
      - "13307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: kiosk1234
    volumes:
      - kiosk-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  kiosk-mysql-data:
